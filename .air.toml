root = "."
tmp_dir = "tmp"

[build]
  cmd = "go tool templ generate && go build -o ./tmp/main ."
  bin = "./tmp/main"
  include_ext = ["go", "templ", "js", "css"]
  exclude_dir = ["tmp", "data", ".git"]
  exclude_regex = ["_test\\.go$", "_templ\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = false
