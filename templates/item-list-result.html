{{range .}}
    
    <li class="grid gap-3 rounded-lg border border-white/10 bg-[#181818] p-4 shadow-lg shadow-black/20">
        <div>
            {{if .Thumbnails.High}}
                <img
                    src="{{.Thumbnails.High.URL}}"
                    alt="Miniatura de {{.Title}}"
                    class="mt-2 aspect-video w-full rounded-lg object-cover"
                >
            {{else if .Thumbnails.Standard}}
                <img
                    src="{{.Thumbnails.Standard.URL}}"
                    alt="Miniatura de {{.Title}}"
                    class="mt-2 aspect-video w-full rounded-lg object-cover"
                >
            {{else}}
                <img
                    src="{{.Thumbnails.Default.URL}}"
                    alt="Miniatura de {{.Title}}"
                    class="mt-2 aspect-video w-full rounded-lg object-cover"
                >
            {{end}}


            <h3 class="mt-3 font-semibold text-white">{{.Title}}</h3>
            <p class="line-clamp-3 text-sm text-slate-400">{{.Description}}</p>
            <p class="mt-2 truncate text-xs font-semibold text-slate-500">Video ID: {{.VideoID}}</p>
        </div>

        <form>
            <input type="hidden" name="video_id" value="{{.VideoID}}">
            <input type="hidden" name="title" value="{{.Title}}">
            <input type="hidden" name="description" value="{{.Description}}">
            <input type="hidden" name="thumbnail" value="{{.Thumbnails.Default.URL}}">

            <button
                type="submit"
                hx-post="/add-to-queue"
                hx-include="closest li"
                hx-target="this"
                hx-swap="outerHTML"
                class="cursor-pointer rounded bg-red-600 px-3 py-2 text-sm font-semibold text-white hover:bg-red-700"
            >
                Agregar a la cola
            </button>
        </form>
    </li>

{{else}}

    <li class="rounded-lg border border-white/10 bg-[#181818] p-4 text-slate-400">No se encontraron canciones.</li>

{{end}}

<div id="toast" class="fixed bottom-5 right-5"></div>
