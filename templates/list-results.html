<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockita office</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>

    <style>
        .htmx-indicator {
            display: none;
        }

        .htmx-request.htmx-indicator {
            display: flex;
        }
    </style>
</head>
<body class="min-h-screen bg-[#0f0f0f] text-white">
    <main class="mx-auto flex min-h-screen w-full max-w-[1800px] flex-col px-4 py-5 sm:px-6 lg:px-8">
        <header class="mb-5 flex shrink-0 flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-4">
            <div>
                <h1 class="text-2xl font-bold">Rockita office</h1>
                <p class="mt-1 text-sm text-slate-400">Busca canciones y administra la cola de hoy</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button id="open-paste-link" type="button" class="rounded border border-white/15 bg-white/5 px-4 py-2 text-sm font-semibold hover:bg-white/10">
                    Pegar link
                </button>
                <p class="text-sm text-slate-400" aria-live="polite">
                    Llamadas a YouTube hoy: <span id="youtube-quota">Cargando…</span>
                </p>
                <a href="/" class="rounded bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700">
                    Abrir reproductor
                </a>
            </div>
        </header>

        <form
            id="search-form"
            hx-get="/search"
            hx-target="#search-results"
            hx-swap="innerHTML"
            hx-indicator="#search-loading"
            hx-sync="this:drop"
            hx-disabled-elt="find button"
            class="mx-auto mb-8 flex w-full max-w-3xl items-center gap-3"
        >
            <input
                type="text" 
                name="query" 
                placeholder="Buscar canciones..."
                class="w-full rounded border border-white/15 bg-[#181818] p-2 text-white placeholder:text-slate-500 focus:border-red-600 focus:outline-none">

            <button
                type="submit"
                class="cursor-pointer rounded bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
            >
                Buscar
            </button>

        </form>        

        <div
            id="toast"
            role="status"
            aria-live="polite"
            class="fixed right-5 top-5 z-50 hidden rounded bg-amber-600 px-4 py-3 text-white shadow-lg"
        ></div>
        
        <div id="search-loading" class="mb-4 flex items-center justify-center htmx-indicator">
            <svg class="mr-3 size-5 animate-spin" width="100" height="100" viewBox="0 0 100 100">
                <circle class="spinner" cx="50" cy="50" r="40" fill="none" stroke="#3498db" stroke-width="8" stroke-dasharray="150" />
            </svg>
        </div>
        
        <ul id="search-results" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></ul>
    </main>
    {{template "paste-link-modal"}}
    <script>
        const searchForm = document.querySelector('#search-form');
        const searchButton = searchForm.querySelector('button[type="submit"]');
        let youtubeQuotaExhausted = false;
        let toastTimeout;

        function scheduleToastDismiss(toastElement) {
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toastElement.classList.add('hidden'), 5000);
        }

        function showQuotaToast() {
            const toast = document.querySelector('#toast');
            toast.textContent = 'Ya no hay más llamadas a YouTube por hoy. Inténtalo de nuevo mañana.';
            toast.classList.remove('hidden');
            scheduleToastDismiss(toast);
        }

        function setQuotaExhausted(exhausted) {
            const justExhausted = exhausted && !youtubeQuotaExhausted;
            youtubeQuotaExhausted = exhausted;
            searchButton.disabled = exhausted;
            if (justExhausted) showQuotaToast();
        }

        async function refreshYouTubeQuota() {
            const response = await fetch('/youtube-quota');
            if (!response.ok) throw new Error('No se pudo cargar el contador de YouTube');
            const quota = await response.json();
            document.querySelector('#youtube-quota').textContent = `${quota.used} / ${quota.limit}`;
            setQuotaExhausted(quota.remaining <= 0);
        }

        const quotaEvents = new EventSource('/queue/events');
        quotaEvents.addEventListener('youtube-quota-updated', () => refreshYouTubeQuota().catch(console.error));
        refreshYouTubeQuota().catch(console.error);

        document.body.addEventListener('htmx:beforeRequest', event => {
            if (event.detail.elt !== searchForm || !youtubeQuotaExhausted) return;
            event.preventDefault();
            showQuotaToast();
        });

        document.body.addEventListener('htmx:responseError', event => {
            const {xhr, requestConfig} = event.detail;
            if (xhr.status !== 429 || !requestConfig.path.startsWith('/search')) return;

            const used = Number(xhr.getResponseHeader('X-YouTube-Quota-Used'));
            const limit = Number(xhr.getResponseHeader('X-YouTube-Quota-Limit'));
            if (Number.isFinite(used) && Number.isFinite(limit)) {
                document.querySelector('#youtube-quota').textContent = `${used} / ${limit}`;
            }
            setQuotaExhausted(true);
            showQuotaToast();
        });

        document.body.addEventListener('htmx:oobAfterSwap', event => {
            const toast = event.detail.elt;
            if (toast?.id === 'toast') scheduleToastDismiss(toast);
        });
    </script>
</body>
</html>
