{{define "player-section"}}
<section id="player-section" class="{{if eq .CurrentPage "list"}}fixed bottom-5 right-5 z-50 w-80 sm:w-96
    rounded-xl border border-white/20 bg-[#181818]/95 shadow-2xl shadow-black/90 backdrop-blur-md
    overflow-hidden ring-1 ring-black/50 transition-all duration-300 group{{else}}flex min-h-0 flex-col
    min-w-0 transition-all duration-300{{end}}" aria-label="Reproductor">

    <!-- Mini Player Header (visible in mini mode) -->
    <div id="mini-player-header" class="{{if ne .CurrentPage "list"}}hidden{{end}} flex items-center
        justify-between gap-2 px-3 py-2 bg-[#141414] border-b border-white/10">
        <div class="flex items-center gap-2 min-w-0">
            <span class="size-2 rounded-full bg-red-500 animate-pulse shrink-0"></span>
            <span id="mini-now-playing" class="text-xs font-semibold text-white truncate">
                Sin reproducción
            </span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
            <button id="mini-skip-btn" type="button"
                class="p-1 rounded text-slate-400 hover:text-white hover:bg-white/10 transition-colors cursor-pointer"
                title="Saltar a la siguiente canción">
                <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
            <button id="mini-expand-btn" type="button"
                class="flex items-center gap-1 rounded bg-red-600 px-2 py-1 text-xs font-semibold text-white hover:bg-red-700 transition-colors cursor-pointer"
                title="Expandir reproductor completo">
                <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                <span>Abrir</span>
            </button>
        </div>
    </div>

    <!-- Full Player Header (hidden in mini mode) -->
    <div id="full-player-header" class="{{if eq .CurrentPage "list"}}hidden{{end}} mb-3 flex shrink-0
        items-center justify-between gap-3">
        <div class="flex items-center gap-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Reproductor:</span>
            <div class="inline-flex rounded-lg border border-white/15 bg-white/5 p-0.5 text-xs">
                <button id="engine-yt-btn" type="button"
                    class="flex items-center gap-1.5 rounded-md px-3 py-1 font-semibold transition-all bg-red-600 text-white shadow cursor-pointer"
                    title="Usar reproductor oficial de YouTube">
                    <svg class="size-3.5 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                    </svg>
                    YouTube
                </button>
                <button id="engine-invidious-btn" type="button"
                    class="flex items-center gap-1.5 rounded-md px-3 py-1 font-semibold transition-all text-slate-400 hover:text-white cursor-pointer"
                    title="Usar reproductor Invidious (evita bloqueos de YouTube)">
                    <svg class="size-3.5 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" />
                    </svg>
                    Invidious
                </button>
            </div>
            <span id="player-engine-badge" class="hidden sm:inline-block text-xs text-slate-500"></span>
        </div>
        <div class="flex items-center gap-2">
            <button id="skip-song-btn" type="button"
                class="flex items-center gap-1.5 rounded border border-white/15 bg-white/5 px-3 py-1.5 text-xs font-semibold hover:bg-white/10 hover:text-white transition-colors cursor-pointer"
                title="Saltar a la siguiente canción de la lista">
                <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
                Saltar canción
            </button>
        </div>
    </div>

    <div id="player-controls" tabindex="0" aria-label="Área de control del reproductor."
        class="relative aspect-video overflow-hidden rounded-lg bg-black shadow-2xl shadow-black/40 focus:outline-none focus:ring-2 focus:ring-red-600">
        <div id="youtube-wrapper" class="h-full w-full">
            <div id="player" class="h-full w-full"></div>
        </div>
        <iframe id="invidious-iframe" class="hidden h-full w-full border-0"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    </div>

    <div id="full-player-footer" class="{{if eq .CurrentPage "list"}}hidden{{end}}">
        <p class="mt-3 text-lg font-semibold text-white truncate" id="now-playing" aria-live="polite">
            No hay canciones en la lista.
        </p>
    </div>
</section>
{{end}}
