{{define "queue-section"}}
<section id="queue-section" class="{{if eq .CurrentPage " list"}}hidden{{end}} flex min-h-0 flex-col"
    aria-labelledby="queue-heading">
    <div class="mb-3 flex flex-col 2xl:flex-row shrink-0 items-center justify-between gap-3">
        <div>
            <h2 id="queue-heading" class="text-lg font-semibold">Cola de hoy</h2>
            <h4 id="queue-count" class="text-sm text-slate-400">{{.QueueCurrent}}/{{.QueueTotal}} canciones</h4>
        </div>
        <div class="flex items-center gap-2 [&>button]:cursor-pointer">
            <button id="shuffle-queue" type="button"
                class="rounded border border-white/15 bg-white/5 px-3 py-2 text-sm hover:bg-white/10 transition-colors"
                title="Mezclar aleatoriamente las canciones de la cola">
                Mezclar
            </button>
            <button id="reorder-queue" type="button"
                class="rounded border border-white/15 bg-white/5 px-3 py-2 text-sm hover:bg-white/10 transition-colors"
                title="Reordenar canciones arrastrándolas">
                Reordenar
            </button>
            <button id="refresh-queue" type="button"
                class="rounded border border-white/15 bg-white/5 px-3 py-2 text-sm hover:bg-white/10">
                Actualizar
            </button>
            <button id="random-queue" type="button"
                class="rounded bg-red-600 px-3 py-2 text-sm font-semibold hover:bg-red-700 disabled:cursor-wait disabled:opacity-60">
                Generar
            </button>
        </div>
    </div>
    <p id="random-queue-status" class="mb-2 min-h-5 text-sm text-slate-400" aria-live="polite"></p>
    <ol id="queue-list"
        class="max-h-[calc(100dvh-15rem)] min-h-0 flex-1 divide-y divide-white/10 overflow-y-auto overscroll-contain rounded-lg border border-white/10 bg-[#181818] scrollbar-thin scrollbar-thumb-slate-400"
        aria-live="polite"></ol>
</section>
{{end}}
