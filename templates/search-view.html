{{define "search-view"}}
<div id="search-view" class="{{if ne .CurrentPage "list"}}hidden{{end}} flex-1 flex flex-col mb-8">
    <div class="relative mx-auto mb-8 w-full max-w-3xl">
        <form id="search-form" hx-get="/search" hx-target="#search-results" hx-swap="innerHTML"
            hx-indicator="#search-loading" hx-sync="this:drop" hx-disabled-elt="find button"
            class="flex w-full items-center gap-3">
            <div class="relative flex-1">
                <input id="search-input" type="text" name="query" placeholder="Buscar canciones..."
                    autocomplete="off"
                    class="w-full rounded border border-white/15 bg-[#181818] p-2 text-white placeholder:text-slate-500 focus:border-red-600 focus:outline-none">
                <ul id="suggestions-dropdown"
                    class="absolute left-0 right-0 top-full z-50 mt-1 hidden max-h-72 overflow-y-auto rounded-lg border border-white/10 bg-[#181818] shadow-2xl backdrop-blur-md divide-y divide-white/5">
                </ul>
            </div>

            <button type="submit"
                class="cursor-pointer rounded bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50">
                Buscar
            </button>
        </form>
    </div>

    <div id="search-loading" class="mb-4 flex items-center justify-center htmx-indicator">
        <svg class="mr-3 size-5 animate-spin" width="100" height="100" viewBox="0 0 100 100">
            <circle class="spinner" cx="50" cy="50" r="40" fill="none" stroke="#3498db" stroke-width="8"
                stroke-dasharray="150" />
        </svg>
    </div>

    <div class="mb-4 flex items-center justify-between">
        <h2 id="results-title" class="text-base font-semibold text-slate-300">
            {{if .Songs}}Tendencias (#{{if .PreloadTag}}{{.PreloadTag}}{{else}}rock{{end}}){{end}}
        </h2>
    </div>

    <ul id="search-results" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        {{if .Songs}}
        {{template "item-list-result.html" .Songs}}
        {{end}}
    </ul>
</div>
{{end}}
