<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Rockita office</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="/yt-music-lite-rmbg.png">
    <link rel="shortcut icon" type="image/png" href="/yt-music-lite-rmbg.png">
    <style>
        .htmx-indicator {
            display: none;
        }

        .htmx-request.htmx-indicator {
            display: flex;
        }
    </style>
</head>

<body class="min-h-screen bg-[#0f0f0f] text-white">
    <main class="mx-auto flex min-h-screen w-full max-w-[1800px] flex-col px-4 py-5 sm:px-6 lg:px-8">
        {{template "header" .}}
        {{template "toast" .}}
        {{template "search-view" .}}

        <!-- Player & Queue Grid View -->
        <div id="player-grid-view" class="{{if eq .CurrentPage "list"}}contents{{else}}grid flex-1 gap-5
            lg:h-[calc(100vh-9rem)] lg:min-h-[32rem] lg:grid-cols-[minmax(0,2.2fr)_minmax(20rem,1fr)]{{end}}">
            {{template "player-section" .}}
            {{template "queue-section" .}}
        </div>
    </main>

    {{template "paste-link-modal"}}

    <div id="app-config" data-current-page="{{.CurrentPage}}" data-invidious-host="{{.InvidiousHost}}" class="hidden"></div>

    <script src="/static/js/player.js"></script>
    <script src="/static/js/queue.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
